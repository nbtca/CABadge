name: Repository checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve committed file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Configure build tool directory
        run: '"CABADGE_BUILD_ROOT=$env:RUNNER_TEMP/cabadge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Install test dependencies
        run: python -m pip install pyserial==3.5 esptool==5.4.0 ziglang==0.14.1 Pillow==12.3.0
      - name: Install Tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk
      - name: Repository integrity
        run: python tools/repository/check_repository.py
      - name: Repository regression tests
        run: python tools/repository/test_repository.py
      - name: Release contracts
        run: python tools/release/test_prepare.py
      - name: Current enclosure revision
        run: python tools/release/prepare.py enclosure hardware/enclosure/releases/V11_V2_1_20261020 --check
      - name: Build configuration boundaries
        run: python firmware-v7/tests/host/test_build_config.py
      - name: Workbench contracts
        run: python firmware-v7/tests/host/test_workbench.py
      - name: USB framing without device access
        run: python firmware-v7/usb_screen/framing.py
      - name: C host checks
        run: |
          $env:CABADGE_ZIG = python -c "import ziglang, pathlib; print(next(pathlib.Path(ziglang.__file__).parent.glob('zig*')))"
          $skip = 'test_build_config.py','test_workbench.py','test_heart_rate.py','test_eaf_direct.py'
          foreach ($test in Get-ChildItem firmware-v7/tests/host/test_*.py, apps/*/tests/host/test_*.py | Where-Object Name -notin $skip) {
            python $test.FullName
            if ($LASTEXITCODE) { throw "$($test.FullName) failed" }
          }
